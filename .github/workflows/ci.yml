name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── C++ core ──────────────────────────────────────────────────────────────────
  cpp:
    name: C++ Build & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Configure
        run: cmake -B core/build -S core -DCMAKE_BUILD_TYPE=Release
        env:
          CC:  gcc-13
          CXX: g++-13

      - name: Build
        run: cmake --build core/build --parallel $(nproc)

      - name: Run tests
        run: ctest --test-dir core/build --output-on-failure

      - name: Run examples (smoke test)
        run: |
          ./core/build/hello_meridian
          ./core/build/anomaly_demo
          ./core/build/multi_pipeline_demo

  # ── Python orchestrator ───────────────────────────────────────────────────────
  python:
    name: Python Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # ── TypeScript dashboard ──────────────────────────────────────────────────────
  typescript:
    name: TypeScript Type-check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ── Docker build check ────────────────────────────────────────────────────────
  docker:
    name: Docker Build Check
    runs-on: ubuntu-24.04
    needs: [cpp, python, typescript]
    steps:
      - uses: actions/checkout@v4
      - name: Build orchestrator image
        run: docker build -f docker/Dockerfile.orchestrator -t meridian-orchestrator:ci .
      - name: Build dashboard image
        run: docker build -f docker/Dockerfile.dashboard -t meridian-dashboard:ci .
      - name: Smoke test orchestrator
        run: |
          docker run -d --name orch -p 8000:8000 meridian-orchestrator:ci
          sleep 5
          curl -sf http://localhost:8000/health
          docker stop orch
